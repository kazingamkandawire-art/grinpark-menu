<!DOCTYPE html>
<html>
<head>
  <title>Grin Park Menu</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      margin: 0;
      padding: 15px;
    }

    h1 {
      text-align: center;
      color: #2e7d32;
      margin-bottom: 5px;
    }

    .notice {
      background: #fff3cd;
      padding: 12px;
      text-align: center;
      border-radius: 8px;
      margin: 10px 0 20px;
      font-weight: bold;
    }

    .section {
      margin-bottom: 30px;
    }

    h2 {
      color: #333;
      border-left: 5px solid #2e7d32;
      padding-left: 10px;
    }

    .item {
      background: white;
      border-radius: 12px;
      padding: 12px;
      margin: 12px 0;
      box-shadow: 0 2px 6px rgba(0,0,0,0.08);
      overflow: hidden;
    }

    .item img {
      width: 100%;
      height: 180px;
      object-fit: cover;
      border-radius: 10px;
      margin-bottom: 10px;
    }

    .price {
      font-weight: bold;
      margin: 5px 0;
    }

    a.order {
      display: inline-block;
      margin-top: 8px;
      padding: 10px 15px;
      background: #2e7d32;
      color: white;
      text-decoration: none;
      border-radius: 6px;
    }
  </style>
</head>

<body>

<h1>🍽️ Grin Park Menu</h1>

<div class="notice">
⏱️ Average preparation time: 20 minutes
</div>

<!-- GRILL -->
<div class="section">
  <h2>🍗 Grill Menu</h2>

  <div class="item">
    <img src="images/drumsticks.jpg">
    <div class="price">4x Drumsticks – MWK 25,000</div>
    <a class="order" href="https://wa.me/265999579445?text=ORDER%0AItem:%204x%20Drumsticks">Order</a>
  </div>

  <div class="item">
    <img src="images/half-chicken.jpg">
    <div class="price">Half Chicken – MWK 29,000</div>
    <a class="order" href="https://wa.me/265999579445?text=ORDER%0AItem:%20Half%20Chicken">Order</a>
  </div>

  <div class="item">
    <img src="images/tbone.jpg">
    <div class="price">T-Bone – MWK 18,000</div>
    <a class="order" href="https://wa.me/265999579445?text=ORDER%0AItem:%20T-Bone">Order</a>
  </div>
</div>

<!-- LOCAL -->
<div class="section">
  <h2>🍲 Local Dishes</h2>

  <div class="item">
    <img src="images/chambo.jpg">
    <div class="price">Chambo – MWK 30,000</div>
    <a class="order" href="https://wa.me/265999579445?text=ORDER%0AItem:%20Chambo">Order</a>
  </div>

  <div class="item">
    <img src="images/usipa.jpg">
    <div class="price">Usipa – MWK 20,000</div>
    <a class="order" href="https://wa.me/265999579445?text=ORDER%0AItem:%20Usipa">Order</a>
  </div>
</div>

<!-- SNACKS -->
<div class="section">
  <h2>🍟 Snacks</h2>

  <div class="item">
    <img src="images/chips.jpg">
    <div class="price">Extra Chips – MWK 5,000</div>
    <a class="order" href="https://wa.me/265999579445?text=ORDER%0AItem:%20Chips">Order</a>
  </div>
</div>

</body>
</html>
