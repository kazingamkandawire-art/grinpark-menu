v><button onclick="a('Red Bull',7500)">Add</button></div></div><div style="position:fixed;right:10px;bottom:10px;background:#fff;border:1px solid #2e7d32;padding:10px"><h3>Order</h3><div id="i"></div>Total: <span id="t">0</span><br><a id="w" href="https://wa.me/" target="_blank">WhatsApp Order</a></div></body></html>
